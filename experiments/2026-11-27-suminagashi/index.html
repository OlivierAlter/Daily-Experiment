<title>Suminagashi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap">
<style>
/* Layout: nothing but a tray of water. A title and two quiet words sit in the lower corners.
   Light theme is ink on washi paper; dark theme is the same tray at night, the ink giving light. */
:root{
  --paper:#f1ece1; --sumi:#1b1a1e; --indigo:#27407a; --vermilion:#c8432b; --ink:#1b1a1e; --muted:#5c564d; --night:0;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#06080b; --sumi:#c9ced6; --indigo:#4f7dff; --vermilion:#ff6a3d; --ink:#e7e9ee; --muted:#9097a3; --night:1; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#06080b; --sumi:#c9ced6; --indigo:#4f7dff; --vermilion:#ff6a3d; --ink:#e7e9ee; --muted:#9097a3; --night:1; color-scheme:dark }
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5;overflow:hidden}
.tray{position:relative;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.cap{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-block:0 18px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));pointer-events:none}
h1{font-size:clamp(22px,3.4vw,30px);font-weight:700;margin:0;letter-spacing:.04em;line-height:1.1}
h1 span{font-weight:500;font-size:.62em;letter-spacing:.3em;margin-left:.5em;color:var(--muted)}
.cap p{margin:4px 0 0;color:var(--muted);max-width:34ch;font-size:14px}
.acts{display:flex;gap:4px;pointer-events:auto;flex-shrink:0}
button{font:500 15px var(--display);letter-spacing:.04em;color:var(--ink);background:transparent;border:0;border-bottom:1px solid transparent;padding:8px 6px;cursor:pointer}
button:hover{border-bottom-color:var(--ink)}
button:focus-visible{outline:2px solid var(--vermilion);outline-offset:2px}
.seal{display:inline-block;width:.62em;height:.62em;background:var(--vermilion);margin-right:.45em;vertical-align:.08em}
</style>

<div class="tray" id="tray">
  <canvas id="c" aria-label="A tray of still water with ink floating and slowly marbling on its surface"></canvas>
  <div class="cap">
    <div>
      <h1><i class="seal"></i>Suminagashi<span>墨流し</span></h1>
      <p id="line">Touch the water to let a drop of ink fall. Touch the same place again and it opens into rings. Drag to comb it.</p>
    </div>
    <div class="acts">
      <button id="print" hidden>Lift a print</button>
      <button id="clear">Fresh water</button>
    </div>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const canvas = $('c'), gl = canvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });
if (!gl){ $('line').textContent = 'This piece is painted with WebGL 2, which this browser did not start.'; $('clear').hidden = true; return; }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const floatOK = !window.__force8 && !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));
gl.getExtension('OES_texture_float_linear');

const VS = `#version 300 es
out vec2 vUv; void main(){ vec2 p = vec2(gl_VertexID == 1 ? 3. : -1., gl_VertexID == 2 ? 3. : -1.); vUv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
const NOISE = `
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }`;
const SIM = `#version 300 es
precision highp float;
uniform sampler2D uPrev; uniform vec2 uRes; uniform float uT, uDt, uAsp, uFlow, uSeed, uFade8;
uniform vec4 uDrop[4]; uniform vec3 uDropCol[4]; uniform float uDropR[4];
uniform vec3 uPtr; uniform vec2 uPtrV;
in vec2 vUv; out vec4 o;
${NOISE}
float psi(vec2 p){ return noise(p * 2.2 + vec2(uT * .03, uSeed)) + .5 * noise(p * 4.7 - vec2(uSeed, uT * .045)); }
void main(){
  vec2 p = vec2(vUv.x * uAsp, vUv.y); float e = .01;
  vec2 v = vec2(psi(p + vec2(0, e)) - psi(p - vec2(0, e)), -(psi(p + vec2(e, 0)) - psi(p - vec2(e, 0)))) / (2. * e) * uFlow;
  float dv = 0.; vec2 dp = p - uPtr.xy; v += uPtrV * exp(-dot(dp, dp) / .005) * uPtr.z;
  for (int i = 0; i < 4; i++){ vec2 d = p - uDrop[i].xy; float r = length(d) + 1e-5, R = uDropR[i]; float x = r / R, g = 1. / (1. + x * x); v += d / r * uDrop[i].z * x * g; dv += uDrop[i].z / R * 2. * g * g; }
  vec2 q = p - v * uDt; vec3 c = texture(uPrev, vec2(q.x / uAsp, q.y)).rgb * exp(-dv * uDt);
  for (int i = 0; i < 4; i++){ vec2 d = p - uDrop[i].xy; c += uDropCol[i] * uDrop[i].w * exp(-dot(d, d) / (uDropR[i] * uDropR[i] * .22)); }
  if (uFade8 > 0.) c = max(c - step(hash(vUv * uRes + fract(uT)), .025) / 255., 0.); else c *= exp(-uDt * .011);
  o = vec4(min(c, vec3(1.5)), 1.);
}`;
const SHOW = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uTexel; uniform vec3 uPaper, uC0, uC1, uC2; uniform float uNight;
in vec2 vUv; out vec4 o;
${NOISE}
float dens(vec2 uv){ vec3 d = texture(uTex, uv).rgb; return d.r + d.g + d.b; }
void main(){
  vec3 d = texture(uTex, vUv).rgb;
  float gx = dens(vUv + vec2(uTexel.x, 0)) - dens(vUv - vec2(uTexel.x, 0)), gy = dens(vUv + vec2(0, uTexel.y)) - dens(vUv - vec2(0, uTexel.y));
  float edge = clamp(length(vec2(gx, gy)) * 2.2, 0., 1.);
  vec2 fc = gl_FragCoord.xy; float grain = noise(fc * .9) * .6 + noise(fc * vec2(.06, 1.7)) * .4;
  vec3 col;
  if (uNight < .5){
    vec3 a = d.r * (1. - uC0) * 2.5 + d.g * (1. - uC1) * 2.3 + d.b * (1. - uC2) * 2.3;
    col = uPaper * exp(-a * (1.7 + edge * 1.4)); col *= .955 + .07 * grain;
  } else {
    vec3 l = d.r * uC0 * .9 + d.g * uC1 * 1.5 + d.b * uC2 * 1.5;
    col = uPaper + (1. - exp(-l * (3.2 + edge * 2.4))); col += (grain - .5) * .012;
  }
  o = vec4(col, 1.);
}`;
function prog(fs){ const p = gl.createProgram(); for (const [t, s] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]){ const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); gl.attachShader(p, sh); } gl.linkProgram(p); const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const nm = gl.getActiveUniform(p, i).name.replace('[0]', ''); u[nm] = gl.getUniformLocation(p, nm); } return { p, u }; }
let sim, show;
try { sim = prog(SIM); show = prog(SHOW); } catch (e){ console.error(e); $('line').textContent = 'The water would not pour: the shaders failed to build on this device.'; return; }
gl.bindVertexArray(gl.createVertexArray());

let SW = 0, SH = 0, asp = 1, bufs = [], cur = 0;
function target(w, h){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, floatOK ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, floatOK ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); return { t, f }; }
function resize(){
  const r = $('tray').getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); canvas.width = Math.max(2, Math.round(r.width * d)); canvas.height = Math.max(2, Math.round(r.height * d));
  const a = r.width / r.height; if (bufs.length && Math.abs(a - asp) < .02) return;
  asp = a; const long = 640; SW = Math.round(a >= 1 ? long : long * a); SH = Math.round(a >= 1 ? long / a : long);
  bufs.forEach(b => { gl.deleteTexture(b.t); gl.deleteFramebuffer(b.f); }); bufs = [target(SW, SH), target(SW, SH)]; cur = 0; compose();
}

/* drops: an ink drop spreads; a drop of clear water pushes what is there into a ring */
const PIG = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
let active = [], queue = [], simT = 0, seed = Math.random() * 50, lastPig = 0;
function bloom(x, y, n, pig, at){ const R = .045 + Math.random() * .04; for (let k = 0; k < n; k++) queue.push({ x: x + (Math.random() - .5) * .012, y: y + (Math.random() - .5) * .012, at: at + k * .42, ink: k % 2 === 0, pig, R: R * (1 + k * .06) }); }
function pickPig(){ const r = Math.random(); lastPig = r < .58 ? 0 : r < .84 ? 1 : 2; return lastPig; }
function randomBloom(at){ bloom((.12 + Math.random() * .76) * asp, .16 + Math.random() * .7, 3 + 2 * Math.floor(Math.random() * 4), pickPig(), at); }
const ptr = { x: 0, y: 0, vx: 0, vy: 0, on: 0 };
function step(dt){
  simT += dt;
  queue = queue.filter(q => { if (q.at > simT) return true; if (active.length >= 4) active.shift(); active.push({ ...q, t0: simT }); return false; });
  active = active.filter(a => simT - a.t0 < 1.5);
  const D = new Float32Array(16), Cc = new Float32Array(12), Rr = new Float32Array(4).fill(.05);
  active.forEach((a, i) => { const age = (simT - a.t0) / 1.5, k = (1 - age) * (1 - age); D.set([a.x, a.y, (a.ink ? .05 : .3) * k, a.ink && age < .2 ? dt * 7 : 0], i * 4); Cc.set(PIG[a.pig], i * 3); Rr[i] = a.R; });
  const src = bufs[cur], dst = bufs[1 - cur];
  gl.useProgram(sim.p); gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f); gl.viewport(0, 0, SW, SH);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.t); gl.uniform1i(sim.u.uPrev, 0);
  gl.uniform2f(sim.u.uRes, SW, SH); gl.uniform1f(sim.u.uT, simT); gl.uniform1f(sim.u.uDt, dt); gl.uniform1f(sim.u.uAsp, asp); gl.uniform1f(sim.u.uFlow, reduce ? .006 : .013); gl.uniform1f(sim.u.uSeed, seed); gl.uniform1f(sim.u.uFade8, floatOK ? 0 : 1);
  gl.uniform4fv(sim.u.uDrop, D); gl.uniform3fv(sim.u.uDropCol, Cc); gl.uniform1fv(sim.u.uDropR, Rr);
  gl.uniform3f(sim.u.uPtr, ptr.x, ptr.y, ptr.on); gl.uniform2f(sim.u.uPtrV, ptr.vx, ptr.vy);
  gl.drawArrays(gl.TRIANGLES, 0, 3); cur = 1 - cur; ptr.vx *= .8; ptr.vy *= .8;
}
let T = null;
function theme(){ const cs = getComputedStyle(document.documentElement), c = n => { const h = cs.getPropertyValue(n).trim(); return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255); };
  T = { paper: c('--paper'), c0: c('--sumi'), c1: c('--indigo'), c2: c('--vermilion'), night: +cs.getPropertyValue('--night') }; }
function paint(){
  gl.useProgram(show.p); gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bufs[cur].t); gl.uniform1i(show.u.uTex, 0); gl.uniform2f(show.u.uTexel, 1 / SW, 1 / SH);
  gl.uniform3fv(show.u.uPaper, T.paper); gl.uniform3fv(show.u.uC0, T.c0); gl.uniform3fv(show.u.uC1, T.c1); gl.uniform3fv(show.u.uC2, T.c2); gl.uniform1f(show.u.uNight, T.night);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function compose(){ // so that the first frame is already a picture: three blooms, left to settle
  active = []; queue = []; simT = 0; seed = Math.random() * 50;
  bloom(asp * .34, .58, 9, 0, .1); bloom(asp * .7, .36, 5, 1, 3.4); bloom(asp * .6, .74, 3, 2, 5.4);
  for (let i = 0; i < 300; i++) step(1 / 30);
  nextAuto = simT + 4;
}
let nextAuto = 4, last = performance.now(), touched = 0;
function frame(now){
  const dt = Math.min(.04, (now - last) / 1000); last = now;
  if (!reduce && simT > nextAuto && simT - touched > 9){ randomBloom(simT); nextAuto = simT + 7 + Math.random() * 9; }
  step(dt); paint(); requestAnimationFrame(frame);
}

/* hands */
let down = null, lastTap = { x: -9, y: -9, ink: false, pig: 0, n: 0 };
const pos = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * asp, 1 - (e.clientY - r.top) / r.height]; };
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); const [x, y] = pos(e); down = { x, y, moved: 0, t: performance.now() }; ptr.x = x; ptr.y = y; touched = simT; });
canvas.addEventListener('pointermove', e => { if (!down) return; const [x, y] = pos(e), now = performance.now(), dt = Math.max(.008, (now - down.t) / 1000);
  const vx = (x - ptr.x) / dt, vy = (y - ptr.y) / dt; down.moved += Math.hypot(x - ptr.x, y - ptr.y); down.t = now;
  if (down.moved > .015){ ptr.on = 1; ptr.vx = Math.max(-1.2, Math.min(1.2, vx * .5)); ptr.vy = Math.max(-1.2, Math.min(1.2, vy * .5)); }
  ptr.x = x; ptr.y = y; touched = simT; });
function up(){ if (!down) return; const d = down; down = null; ptr.on = 0;
  if (d.moved > .015) return;
  const near = Math.hypot(d.x - lastTap.x, d.y - lastTap.y) < .07;
  const ink = near ? !lastTap.ink : true, pig = near ? lastTap.pig : pickPig(), n = near ? lastTap.n + 1 : 0;
  queue.push({ x: d.x, y: d.y, at: simT, ink, pig, R: .05 + n * .004 }); lastTap = { x: d.x, y: d.y, ink, pig, n }; }
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', () => { down = null; ptr.on = 0; });
$('clear').onclick = () => { bufs.forEach(b => { gl.bindFramebuffer(gl.FRAMEBUFFER, b.f); gl.clear(gl.COLOR_BUFFER_BIT); }); active = []; queue = []; touched = simT; nextAuto = simT + 12; lastTap.x = -9; };

const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
use('downloads').then(dl => { if (!dl) return; const b = $('print'); b.hidden = false;
  b.onclick = () => { paint(); canvas.toBlob(async blob => { if (!blob) return; b.disabled = true;
      try { await dl.save({ filename: 'suminagashi-print.png', data: blob }); b.textContent = 'Print lifted'; } catch (e){ b.textContent = e && e.code === 'declined' ? 'Lift a print' : 'The paper slipped. Again?'; }
      b.disabled = false; setTimeout(() => { b.textContent = 'Lift a print'; }, 4000); }, 'image/png'); }; });

theme(); resize();
new ResizeObserver(resize).observe($('tray'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', theme);
new MutationObserver(theme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
window.__sumi = { floatOK };
requestAnimationFrame(frame);
})();
</script>
