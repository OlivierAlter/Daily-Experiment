<title>Nowhere Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap">
<style>
/* Layout: a nautical chart sheet fills the left; a gazetteer column on the right lists what the
   survey found. Palette follows paper sea charts: buff land, blue shoals, magenta annotations. */
:root{
  --bg:#dde3e8; --panel:#f5f7f8; --ink:#1a1d22; --muted:#5a6470; --line:#1a1d2226;
  --sea:#f6f9fa; --shoal:#cfe4ef; --shoal-line:#7fb0cc;
  --b0:#f2e5b8; --b1:#ebdba5; --b2:#e3cf91; --b3:#d9c17e; --b4:#cdb26c; --b5:#c0a15b;
  --contour:#9a7a3a; --coast:#24262b; --river:#3478ad; --note:#a11f8c; --halo:#f2e5b8;
  --display:"Cormorant Garamond","Hoefler Text",Garamond,Georgia,serif;
  --ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#05080c; --panel:#0d131a; --ink:#dedacb; --muted:#8c96a0; --line:#dedacb26;
  --sea:#0a1118; --shoal:#11222f; --shoal-line:#2f5d7a;
  --b0:#25261f; --b1:#2d2d23; --b2:#363527; --b3:#403d2b; --b4:#4a4530; --b5:#554e35;
  --contour:#857548; --coast:#cfc8ac; --river:#56a3da; --note:#e679d2; --halo:#25261f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#05080c; --panel:#0d131a; --ink:#dedacb; --muted:#8c96a0; --line:#dedacb26;
  --sea:#0a1118; --shoal:#11222f; --shoal-line:#2f5d7a;
  --b0:#25261f; --b1:#2d2d23; --b2:#363527; --b3:#403d2b; --b4:#4a4530; --b5:#554e35;
  --contour:#857548; --coast:#cfc8ac; --river:#56a3da; --note:#e679d2; --halo:#25261f; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45}
.page{max-width:1320px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:500;font-size:clamp(32px,4.6vw,46px);line-height:1;margin:0}
h1 em{font-style:italic;color:var(--note)}
.top p{margin:6px 0 0;color:var(--muted);max-width:52ch}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text]{font:500 16px var(--ui);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:9px 12px;width:min(230px,60vw)}
button{font:600 15px var(--ui);letter-spacing:.02em;cursor:pointer;border-radius:2px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px}
button.primary{background:var(--ink);color:var(--bg);border-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--note);outline-offset:2px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){ .main{grid-template-columns:minmax(0,1fr)} }
.sheet{position:relative;background:var(--sea);border:1px solid var(--coast);outline:4px solid var(--sea);outline-offset:-7px;box-shadow:0 24px 50px -30px #000b}
.sheet svg{display:block;width:100%;height:auto;aspect-ratio:1400/980;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.sheet svg.drag{cursor:grabbing}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:36px;height:36px;padding:0;font-size:18px;line-height:1}

.gaz{background:var(--panel);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.gaz .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--note);font-weight:600}
.gaz h2{font-family:var(--display);font-style:italic;font-weight:600;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.gaz p{margin:0;color:var(--muted);font-size:15px}
.gaz ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.gaz li{border-bottom:1px solid var(--line)}
.gaz li button{display:grid;grid-template-columns:18px minmax(0,1fr);gap:2px 8px;width:100%;text-align:left;border:0;background:transparent;padding:9px 4px;border-radius:0;font-weight:400}
.gaz li button[aria-current="true"]{background:color-mix(in srgb,var(--note) 12%,transparent)}
.gaz .nm{font-weight:600;font-size:16px}
.gaz .kd{grid-column:2;font-size:13px;color:var(--muted);letter-spacing:.02em}
.gaz .gl{color:var(--note);font-size:13px;line-height:1.6}
.gaz .foot{font-size:13px}

/* chart symbology, shared with the exported file */
#map .sea{fill:var(--sea)} #map .shoal{fill:var(--shoal);stroke:var(--shoal-line);stroke-width:.8}
#map .deep{fill:none;stroke:var(--shoal-line);stroke-width:.6;stroke-dasharray:5 4}
#map .b0{fill:var(--b0)} #map .b1{fill:var(--b1)} #map .b2{fill:var(--b2)} #map .b3{fill:var(--b3)} #map .b4{fill:var(--b4)} #map .b5{fill:var(--b5)}
#map .ct{fill:none;stroke:var(--contour);stroke-width:.7}
#map .coast{fill:none;stroke:var(--coast);stroke-width:1.8;stroke-linejoin:round}
#map .river{fill:none;stroke:var(--river);stroke-linecap:round;stroke-linejoin:round}
#map .grat{stroke:var(--line);stroke-width:.6} #map .frame{fill:none;stroke:var(--coast);stroke-width:1.4}
#map text{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;fill:var(--ink)}
#map .tick{font-size:11px;fill:var(--muted)}
#map .snd{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:12px;fill:var(--muted);text-anchor:middle}
#map .lbl{font-size:15px;font-weight:500;paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round}
#map .lbl.cap{font-size:17px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
#map .lbl.pk{font-size:13px;font-style:italic}
#map .water{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;fill:var(--river)}
#map .seaname{font-size:26px;letter-spacing:.22em;text-anchor:middle;fill:var(--river)}
#map .rv{font-size:13px;paint-order:stroke;stroke:var(--halo);stroke-width:3px}
#map .dot{fill:var(--coast);stroke:var(--halo);stroke-width:1.5}
#map .dot.v{fill:var(--halo);stroke:var(--coast)}
#map .peak{fill:var(--coast)}
#map .place{cursor:pointer}
#map .ring{fill:none;stroke:var(--note);stroke-width:2.5}
#map .note{fill:var(--note)} #map .rose{stroke:var(--note);fill:none;stroke-width:1}
#map .cart{fill:var(--sea);stroke:var(--coast);stroke-width:1}
#map .title{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:32px}
#map .sub{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;fill:var(--muted)}
#map .bar{fill:var(--coast)} #map .bar.o{fill:var(--sea);stroke:var(--coast);stroke-width:1}
@media (prefers-reduced-motion: no-preference){
  #map .coast{stroke-dasharray:1;animation:plot 1.8s ease-out both}
  #map .late{animation:ink .7s ease-out 1.1s both}
  @keyframes plot{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes ink{from{opacity:0}to{opacity:1}}
}
</style>

<div class="page">
  <div class="top">
    <div>
      <h1>Nowhere <em>Atlas</em></h1>
      <p>Every word is the name of an island that does not exist. Type one and it gets surveyed: coast, soundings, rivers, towns.</p>
    </div>
    <form id="form" autocomplete="off">
      <input type="text" id="seed" maxlength="24" aria-label="Word to chart" placeholder="your name, a word…">
      <button class="primary" type="submit">Chart it</button>
      <button type="button" id="rand">Surprise me</button>
    </form>
  </div>

  <div class="main">
    <div class="sheet">
      <svg id="map" viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Generated chart of an imaginary island"></svg>
      <div class="zoom">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zall" aria-label="Show whole chart">⤢</button>
      </div>
    </div>
    <aside class="gaz">
      <div class="eyebrow">Gazetteer</div>
      <h2 id="isle"></h2>
      <p id="blurb"></p>
      <ol id="list"></ol>
      <button id="save" hidden>Save this chart as SVG</button>
      <p class="foot" id="foot">Drag to pan, pinch or scroll to zoom. The address of this page keeps the island, so the same word always gives the same chart.</p>
    </aside>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const W = 1400, HT = 980, GW = 160, GH = 112, CS = W / GW, W1 = GW + 1;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f1 = n => n.toFixed(1);
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }
function rng(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24);

/* ---------- terrain ---------- */
function makeNoise(seed){
  const lat = (x, y) => { let h = seed ^ Math.imul(x, 374761393) ^ Math.imul(y, 668265263); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };
  const n2 = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = lat(xi, yi), b = lat(xi + 1, yi), c = lat(xi, yi + 1), d = lat(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
  return (x, y) => { let s = 0, amp = .5, f = 1; for (let o = 0; o < 5; o++){ s += amp * n2(x * f, y * f); amp *= .5; f *= 2.03; } return s / .96875; };
}
function terrain(seed){
  const fbm = makeNoise(seed), H = new Float32Array(W1 * (GH + 1));
  let lift = 0;
  for (let tries = 0; tries < 5; tries++){
    let land = 0, mx = 0;
    for (let j = 0; j <= GH; j++) for (let i = 0; i <= GW; i++){
      const u = i / GW, v = j / GH, nx = (u - .5) * 2, ny = (v - .5) * 2;
      const wx = fbm(u * 2 + 5.2, v * 2 + 9.1) - .5, wy = fbm(u * 2 + 31.7, v * 2 + 3.3) - .5;
      const dx = nx * .98 + wx * .7, dy = ny * 1.12 + wy * .7, d = Math.sqrt(dx * dx + dy * dy);
      const edge = Math.max(Math.abs(nx), Math.abs(ny));
      let e = fbm(u * 4.4 + 2, v * 3.1 + 7) * 1.3 - .36 + lift - d * d * .9 - Math.max(0, edge - .8) * 3;
      H[j * W1 + i] = e; if (e > 0){ land++; if (e > mx) mx = e; }
    }
    if (land > H.length * .1){ for (let k = 0; k < H.length; k++) if (H[k] > 0) H[k] /= mx; return H; }
    lift += .09;
  }
  return H;
}
function contour(H, L){
  const ept = new Map(), segs = [];
  const eh = (i, j) => { const id = j * W1 + i; if (!ept.has(id)){ const a = H[id], b = H[id + 1]; ept.set(id, [(i + (L - a) / (b - a)) * CS, j * CS]); } return id; };
  const ev = (i, j) => { const id = 1e6 + j * W1 + i; if (!ept.has(id)){ const a = H[j * W1 + i], b = H[(j + 1) * W1 + i]; ept.set(id, [i * CS, (j + (L - a) / (b - a)) * CS]); } return id; };
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++){
    const k = j * W1 + i, code = (H[k] > L) | (H[k + 1] > L) << 1 | (H[k + W1 + 1] > L) << 2 | (H[k + W1] > L) << 3;
    if (code === 0 || code === 15) continue;
    const T = () => eh(i, j), R = () => ev(i + 1, j), B = () => eh(i, j + 1), Lf = () => ev(i, j);
    switch (code){
      case 1: case 14: segs.push([Lf(), T()]); break;   case 2: case 13: segs.push([T(), R()]); break;
      case 3: case 12: segs.push([Lf(), R()]); break;   case 4: case 11: segs.push([R(), B()]); break;
      case 6: case 9: segs.push([T(), B()]); break;     case 7: case 8: segs.push([Lf(), B()]); break;
      case 5: segs.push([Lf(), T()], [R(), B()]); break; case 10: segs.push([T(), R()], [Lf(), B()]); break;
    }
  }
  const adj = new Map(); segs.forEach((s, n) => { for (const e of s){ if (!adj.has(e)) adj.set(e, []); adj.get(e).push(n); } });
  const used = new Uint8Array(segs.length), out = [];
  const next = (e, chain, front) => { for (;;){ const c = adj.get(e).find(n => !used[n]); if (c == null) return; used[c] = 1; e = segs[c][0] === e ? segs[c][1] : segs[c][0]; front ? chain.unshift(e) : chain.push(e); } };
  for (let n = 0; n < segs.length; n++){ if (used[n]) continue; used[n] = 1; const ch = [segs[n][0], segs[n][1]]; next(ch[1], ch, false); next(ch[0], ch, true);
    const closed = ch[0] === ch[ch.length - 1]; if (closed) ch.pop(); if (ch.length > 3) out.push({ closed, pts: ch.map(e => ept.get(e)) }); }
  return out;
}
function pathOf(lines){
  let d = '';
  for (const { pts, closed } of lines){
    const n = pts.length, mid = (a, b) => f1((a[0] + b[0]) / 2) + ' ' + f1((a[1] + b[1]) / 2);
    if (closed){ d += 'M' + mid(pts[n - 1], pts[0]); for (let k = 0; k < n; k++) d += 'Q' + f1(pts[k][0]) + ' ' + f1(pts[k][1]) + ' ' + mid(pts[k], pts[(k + 1) % n]); d += 'Z'; }
    else { d += 'M' + f1(pts[0][0]) + ' ' + f1(pts[0][1]); for (let k = 1; k < n - 1; k++) d += 'Q' + f1(pts[k][0]) + ' ' + f1(pts[k][1]) + ' ' + mid(pts[k], pts[k + 1]); d += 'L' + f1(pts[n - 1][0]) + ' ' + f1(pts[n - 1][1]); }
  }
  return d;
}

/* ---------- names ---------- */
function namer(r){
  const pick = (a, n) => { const c = a.slice(), o = []; while (o.length < n && c.length) o.push(c.splice(Math.floor(r() * c.length), 1)[0]); return o; };
  const on = pick(['b','br','c','d','dr','f','g','gl','h','k','l','m','n','p','r','s','sk','st','t','th','tr','v','w','y','z'], 10),
        vo = pick(['a','e','i','o','u','ae','ei','ou','y','oa'], 5), co = pick(['n','r','l','s','th','m','nd','rk','sk','ll'], 5);
  const one = a => a[Math.floor(r() * a.length)], seen = new Set();
  const root = () => { for (let t = 0; t < 30; t++){ const syl = r() < .22 ? 1 : r() < .85 ? 2 : 3; let s = ''; for (let k = 0; k < syl; k++) s += one(on) + one(vo); if (r() < .7 || syl === 1) s += one(co);
      s = s[0].toUpperCase() + s.slice(1); if (!seen.has(s) && s.length > 2){ seen.add(s); return s; } } return 'Anon'; };
  return { root, one };
}
const KNOWN = ['a lighthouse that was built facing inland','smoked eel and long arguments','the only bookshop on the island','a clock that runs eleven minutes fast','ropewalks and salt pans','a Tuesday market that starts on Monday night','its choir, which nobody asked for','boatbuilding in larch','a ferry that leaves when it is full','sheep that swim between the skerries','a bridge with a toll of one song','cider strong enough to be regulated','a tide bell that rings twice a day','kelp burning and its smell','the harbour wall, rebuilt nine times','a library of ships\' logs','honey from the heather','a well that tastes faintly of iron','weather that the rest of the island blames on it','an annual race up the hill and back','stone walls with no mortar and no gates','a brass band with two tubas','lobster pots stacked like a second town','fog'];

/* ---------- survey ---------- */
let S = null, picked = -1;
function survey(seed){
  const sd = hash(seed), r = rng(sd), H = terrain(sd), nm = namer(rng(sd ^ 0x9e3779b9));
  const at = (i, j) => H[j * W1 + i], P = (i, j) => [i * CS, j * CS];
  // rivers
  const mark = new Uint8Array(H.length), srcs = [], rivers = [];
  for (let t = 0; t < 4000 && srcs.length < 8; t++){ const i = 4 + Math.floor(r() * (GW - 8)), j = 4 + Math.floor(r() * (GH - 8)), h = at(i, j);
    if (h > .42 && h < .92 && srcs.every(s => Math.hypot(s[0] - i, s[1] - j) > 13)) srcs.push([i, j]); }
  for (const [si, sj] of srcs){
    let i = si, j = sj; const pts = [[i, j]]; let end = 'lake';
    for (let n = 0; n < 500; n++){
      let bi = i, bj = j, bh = at(i, j);
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++){ const h = at(i + di, j + dj); if (h < bh){ bh = h; bi = i + di; bj = j + dj; } }
      if (bi === i && bj === j) break;
      i = bi; j = bj; pts.push([i, j]);
      if (bh < 0){ end = 'sea'; break; } if (mark[j * W1 + i]){ end = 'join'; break; }
    }
    if (pts.length < 6) continue;
    pts.forEach(p => { mark[p[1] * W1 + p[0]] = 1; });
    const xy = pts.map((p, k) => [(p[0] + (k && k < pts.length - 1 ? (r() - .5) * .7 : 0)) * CS, (p[1] + (k && k < pts.length - 1 ? (r() - .5) * .7 : 0)) * CS]);
    rivers.push({ xy, end, mouth: end === 'sea' ? pts[pts.length - 2] : null, mid: xy[Math.floor(xy.length * .45)], name: nm.root(), len: pts.length });
  }
  // settlements
  const cand = [];
  rivers.forEach(v => { if (v.mouth) cand.push({ g: v.mouth, where: 'mouth', river: v.name }); });
  const coastal = [];
  for (let j = 6; j < GH - 6; j++) for (let i = 8; i < GW - 14; i++){ const h = at(i, j); if (h > 0 && h < .09 && (at(i + 1, j) < 0 || at(i - 1, j) < 0 || at(i, j + 1) < 0 || at(i, j - 1) < 0)) coastal.push([i, j]); }
  for (let k = 0; k < 60 && coastal.length; k++) cand.push({ g: coastal[Math.floor(r() * coastal.length)], where: 'coast' });
  rivers.forEach(v => { const p = v.xy[Math.floor(v.xy.length * .5)]; cand.push({ g: [Math.round(p[0] / CS), Math.round(p[1] / CS)], where: 'inland', river: v.name }); });
  const towns = [];
  for (const c of cand){ if (towns.length >= 8) break; const [x, y] = P(c.g[0], c.g[1]);
    if (x < 70 || x > W - 190 || y < 60 || y > HT - 60 || at(c.g[0], c.g[1]) <= 0) continue;
    if (towns.some(t => Math.hypot(t.x - x, t.y - y) < 125)) continue;
    towns.push({ x, y, where: c.where, river: c.river }); }
  towns.forEach((t, k) => {
    const R = nm.root();
    t.kind = k === 0 ? 'capital' : k < 4 ? 'town' : 'village';
    t.name = t.where === 'mouth' ? (r() < .5 ? R + 'mouth' : 'Port ' + R) : t.where === 'coast' ? (r() < .75 ? R + nm.one(['haven','wick','ness','by','ton']) : 'St ' + R) : (r() < .7 ? R + nm.one(['ford','stead','holt','dale']) : R);
    t.pop = t.kind === 'capital' ? 2000 + Math.floor(r() * 7000) : t.kind === 'town' ? 300 + Math.floor(r() * 1600) : 40 + Math.floor(r() * 240);
    t.fact = KNOWN[Math.floor(r() * KNOWN.length)];
  });
  // summits
  const tops = [];
  for (let j = 3; j < GH - 3; j++) for (let i = 3; i < GW - 3; i++){ const h = at(i, j); if (h < .5) continue; let ok = true;
    for (let dj = -3; dj <= 3 && ok; dj++) for (let di = -3; di <= 3; di++) if ((di || dj) && at(i + di, j + dj) > h){ ok = false; break; } if (ok) tops.push([h, i, j]); }
  tops.sort((a, b) => b[0] - a[0]);
  const peaks = [];
  for (const [h, i, j] of tops){ if (peaks.length >= 3) break; const [x, y] = P(i, j); if (peaks.some(p => Math.hypot(p.x - x, p.y - y) < 110) || towns.some(t => Math.hypot(t.x - x, t.y - y) < 50)) continue;
    const R = nm.root(); peaks.push({ x, y, m: Math.round(h * 870 + 40), name: nm.one(['Mt ' + R, R + ' Pike', 'Ben ' + R, R + ' Fell']) }); }
  // corners: the emptiest take the title block and compass, the others take sea names
  const corners = [[190, 150], [W - 190, 150], [190, HT - 150], [W - 190, HT - 150]].map(c => { let m = -9; for (let dj = -14; dj <= 14; dj += 2) for (let di = -20; di <= 20; di += 2) m = Math.max(m, at(Math.round(c[0] / CS) + di, Math.round(c[1] / CS) + dj)); return { c, m }; }).sort((a, b) => a.m - b.m);
  // soundings
  const snd = [];
  for (let t = 0; t < 900 && snd.length < 46; t++){ const i = 4 + Math.floor(r() * (GW - 8)), j = 4 + Math.floor(r() * (GH - 8)), h = at(i, j); if (h > -.015 || h < -1.4) continue; const [x, y] = P(i, j);
    if (snd.some(s => Math.hypot(s.x - x, s.y - y) < 70) || corners.slice(0, 2).some(k => Math.abs(k.c[0] - x) < 200 && Math.abs(k.c[1] - y) < 110)) continue; snd.push({ x, y, d: Math.max(1, Math.round(-h * 180)) }); }
  let land = 0; for (let k = 0; k < H.length; k++) if (H[k] > 0) land++;
  const R0 = nm.root();
  return { seed, H, rivers, towns, peaks, corners, snd, r,
    isle: nm.one(['Isle of ' + R0, R0 + ' Island', 'The ' + R0 + ' Holm', R0]), seas: [nm.root() + ' Sound', 'Bay of ' + nm.root()],
    km2: Math.round(land * (CS * .02) * (CS * .02)), lat: 44 + Math.floor(r() * 18), lon: 2 + Math.floor(r() * 30), m0: Math.floor(r() * 40) };
}

function draw(){
  const s = S, H = s.H; let g = '';
  g += `<rect class="sea" width="${W}" height="${HT}"/>`;
  g += `<path class="deep late" d="${pathOf(contour(H, -.3))}"/><path class="shoal late" fill-rule="evenodd" d="${pathOf(contour(H, -.09))}"/>`;
  for (let x = 175; x < W; x += 175) g += `<line class="grat" x1="${x}" y1="0" x2="${x}" y2="${HT}"/>`;
  for (let y = 140; y < HT; y += 140) g += `<line class="grat" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;
  const LV = [0, .12, .26, .42, .6, .8], cs = LV.map(l => pathOf(contour(H, l)));
  cs.forEach((d, k) => { g += `<path class="b${k}${k ? ' late' : ''}" fill-rule="evenodd" d="${d}"/>`; });
  g += '<g class="late">' + cs.slice(1).map(d => `<path class="ct" d="${d}"/>`).join('') + '</g>';
  g += '<g class="late">' + s.snd.map(o => `<text class="snd" x="${f1(o.x)}" y="${f1(o.y)}">${o.d}</text>`).join('') + '</g>';
  g += '<g class="late">' + s.rivers.map(v => `<path class="river" stroke-width="${f1(clamp(1.2 + v.len * .035, 1.2, 3.4))}" d="${pathOf([{ pts: v.xy, closed: false }])}"/>`).join('') + '</g>';
  g += `<path class="coast" pathLength="1" d="${cs[0]}"/>`;
  g += '<g class="late">';
  s.rivers.forEach(v => { if (v.len > 12) g += `<text class="water rv" x="${f1(v.mid[0] + 7)}" y="${f1(v.mid[1] - 5)}">R. ${esc(v.name)}</text>`; });
  s.corners.slice(2).forEach((k, n) => { g += `<text class="water seaname" x="${k.c[0]}" y="${k.c[1]}">${esc(s.seas[n].toUpperCase())}</text>`; });
  s.peaks.forEach((p, n) => { g += `<g class="place" data-k="p${n}"><path class="peak" d="M${f1(p.x - 6)} ${f1(p.y + 4)}L${f1(p.x)} ${f1(p.y - 7)}L${f1(p.x + 6)} ${f1(p.y + 4)}Z"/><text class="lbl pk" x="${f1(p.x + 9)}" y="${f1(p.y + 4)}">${esc(p.name)} · ${p.m}</text></g>`; });
  s.towns.forEach((t, n) => {
    const sym = t.kind === 'capital' ? `<rect class="dot" x="${f1(t.x - 5)}" y="${f1(t.y - 5)}" width="10" height="10"/>` : `<circle class="dot${t.kind === 'village' ? ' v' : ''}" cx="${f1(t.x)}" cy="${f1(t.y)}" r="${t.kind === 'town' ? 4.5 : 3.5}"/>`;
    g += `<g class="place" data-k="t${n}"><circle cx="${f1(t.x)}" cy="${f1(t.y)}" r="16" fill="transparent"/>${sym}<text class="lbl${t.kind === 'capital' ? ' cap' : ''}" x="${f1(t.x + 10)}" y="${f1(t.y + 5)}">${esc(t.name)}</text></g>`; });
  // compass rose
  const [cx, cy] = s.corners[1].c; g += `<g class="rose"><circle cx="${cx}" cy="${cy}" r="62"/><circle cx="${cx}" cy="${cy}" r="50"/>`;
  for (let a = 0; a < 360; a += 10){ const q = a * Math.PI / 180, r1 = a % 90 === 0 ? 34 : a % 30 === 0 ? 44 : 50; g += `<line x1="${f1(cx + Math.sin(q) * r1)}" y1="${f1(cy - Math.cos(q) * r1)}" x2="${f1(cx + Math.sin(q) * 62)}" y2="${f1(cy - Math.cos(q) * 62)}"/>`; }
  g += `</g><path class="note" d="M${cx} ${cy - 78}l7 22h-14z"/><text class="note" x="${cx}" y="${cy - 84}" text-anchor="middle" font-size="14" font-weight="600">N</text>`;
  // title block with scale bar: 1400 units = 28 km
  const [tx, ty] = s.corners[0].c, bx = tx - 160, by = ty - 78;
  g += `<rect class="cart" x="${bx}" y="${by}" width="320" height="156"/><rect class="cart" x="${bx + 5}" y="${by + 5}" width="310" height="146" fill="none"/>`;
  g += `<text class="sub" x="${tx}" y="${by + 30}" text-anchor="middle">Chart of</text><text class="title" x="${tx}" y="${by + 64}" text-anchor="middle">${esc(s.isle)}</text>`;
  g += `<text class="sub" x="${tx}" y="${by + 86}" text-anchor="middle">Surveyed from the word “${esc(s.seed)}”</text>`;
  for (let k = 0; k < 5; k++) g += `<rect class="bar${k % 2 ? ' o' : ''}" x="${tx - 125 + k * 50}" y="${by + 104}" width="50" height="6"/>`;
  g += `<text class="tick" x="${tx - 125}" y="${by + 126}" text-anchor="middle">0</text><text class="tick" x="${tx + 125}" y="${by + 126}" text-anchor="middle">5 km</text><text class="tick" x="${tx}" y="${by + 142}" text-anchor="middle">Heights in metres · soundings in fathoms</text>`;
  for (let x = 175, k = 1; x < W; x += 175, k++) g += `<text class="tick" x="${x + 4}" y="14">${s.lon}°${String((s.m0 + k * 2) % 60).padStart(2, '0')}′W</text>`;
  for (let y = 140, k = 1; y < HT; y += 140, k++) g += `<text class="tick" x="6" y="${y - 4}">${s.lat}°${String((s.m0 + 30 - k * 2 + 60) % 60).padStart(2, '0')}′N</text>`;
  g += `</g><rect class="frame" x=".7" y=".7" width="${W - 1.4}" height="${HT - 1.4}"/><g id="sel"></g>`;
  $('map').innerHTML = g;

  $('isle').textContent = s.isle;
  const hi = s.peaks[0];
  $('blurb').textContent = `About ${s.km2} km² of land in a 28 by 19.6 km sheet. ${s.towns.length} settlements, ${s.rivers.length} rivers` + (hi ? `, and a high point of ${hi.m} m at ${hi.name}.` : '.');
  const list = $('list'); list.textContent = '';
  const add = (key, glyph, name, kind) => { const li = document.createElement('li'), b = document.createElement('button'); b.dataset.k = key;
    const gl = document.createElement('span'); gl.className = 'gl'; gl.textContent = glyph; const n = document.createElement('span'); n.className = 'nm'; n.textContent = name; const k = document.createElement('span'); k.className = 'kd'; k.textContent = kind;
    b.append(gl, n, k); b.onclick = () => pick(key, true); li.append(b); list.append(li); };
  s.towns.forEach((t, n) => add('t' + n, t.kind === 'capital' ? '■' : t.kind === 'town' ? '●' : '○', t.name, `${t.kind[0].toUpperCase() + t.kind.slice(1)}, pop. ${t.pop.toLocaleString('en')}. Known for ${t.fact}.`));
  s.peaks.forEach((p, n) => add('p' + n, '▲', p.name, `Summit, ${p.m} m`));
  picked = -1; view = { x: 0, y: 0, w: W }; apply();
}
function pick(key, fly){
  const o = key[0] === 't' ? S.towns[+key.slice(1)] : S.peaks[+key.slice(1)]; if (!o) return;
  $('sel').innerHTML = `<circle class="ring" cx="${f1(o.x)}" cy="${f1(o.y)}" r="15"/>`;
  document.querySelectorAll('#list button').forEach(b => b.setAttribute('aria-current', b.dataset.k === key));
  if (fly){ const w = 620; flyTo({ x: o.x - w / 2, y: o.y - w * .35, w }); }
  else { const b = document.querySelector(`#list button[data-k="${key}"]`); if (b) b.scrollIntoView({ block: 'nearest' }); }
}

/* ---------- pan and zoom ---------- */
const map = $('map'); let view = { x: 0, y: 0, w: W }, anim = 0;
function fit(v){ v.w = clamp(v.w, 240, W); const h = v.w * HT / W; v.x = clamp(v.x, 0, W - v.w); v.y = clamp(v.y, 0, HT - h); return v; }
function apply(){ fit(view); map.setAttribute('viewBox', `${f1(view.x)} ${f1(view.y)} ${f1(view.w)} ${f1(view.w * HT / W)}`); }
function flyTo(to){ fit(to); cancelAnimationFrame(anim); const from = { ...view }, t0 = performance.now(), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const go = now => { const t = still ? 1 : clamp((now - t0) / 550, 0, 1), e = 1 - Math.pow(1 - t, 3); view = { x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e, w: from.w + (to.w - from.w) * e }; apply(); if (t < 1) anim = requestAnimationFrame(go); };
  anim = requestAnimationFrame(go); }
function zoomAt(f, px, py){ const r = map.getBoundingClientRect(), u = (px - r.left) / r.width, v = (py - r.top) / r.height, h = view.w * HT / W, mx = view.x + u * view.w, my = view.y + v * h;
  const w = clamp(view.w * f, 240, W); view = { x: mx - u * w, y: my - v * w * HT / W, w }; apply(); }
const ptr = new Map(); let moved = 0, pinch = 0;
map.addEventListener('pointerdown', e => { map.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; cancelAnimationFrame(anim); map.classList.add('drag');
  if (ptr.size === 2){ const [a, b] = [...ptr.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
map.addEventListener('pointermove', e => { const p = ptr.get(e.pointerId); if (!p) return; const r = map.getBoundingClientRect(), k = view.w / r.width;
  if (ptr.size === 1){ view.x -= (e.clientX - p[0]) * k; view.y -= (e.clientY - p[1]) * k; moved += Math.abs(e.clientX - p[0]) + Math.abs(e.clientY - p[1]); apply(); }
  ptr.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptr.size === 2){ const [a, b] = [...ptr.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) zoomAt(pinch / d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pinch = d; moved = 99; } });
const up = e => { ptr.delete(e.pointerId); pinch = 0; if (!ptr.size) map.classList.remove('drag'); };
map.addEventListener('pointerup', e => { const tap = ptr.size === 1 && moved < 6; up(e); if (tap){ const el = document.elementFromPoint(e.clientX, e.clientY), g = el && el.closest && el.closest('.place'); if (g) pick(g.dataset.k, false); } });
map.addEventListener('pointercancel', up);
map.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(e.deltaY * .0016), e.clientX, e.clientY); }, { passive: false });
const centre = f => { const r = map.getBoundingClientRect(); zoomAt(f, r.left + r.width / 2, r.top + r.height / 2); };
$('zin').onclick = () => centre(.65); $('zout').onclick = () => centre(1.5); $('zall').onclick = () => flyTo({ x: 0, y: 0, w: W });

/* ---------- seeds ---------- */
function chart(word, push){
  const sdg = slug(word) || 'nowhere'; S = survey(sdg); draw(); $('seed').value = sdg;
  if (push){ try { if (location.hash.slice(1) !== sdg) location.hash = sdg; } catch (e){} }
}
const A = ['quiet','salt','amber','low','far','lost','grey','glass','north','idle','thin','old','bright','hollow','tall','soft'], B = ['heron','anchor','lantern','otter','harbour','kettle','compass','gannet','thistle','mooring','pebble','signal','cormorant','ladder','barley','oyster'];
$('rand').onclick = () => chart(A[Math.floor(Math.random() * A.length)] + '-' + B[Math.floor(Math.random() * B.length)], true);
$('form').addEventListener('submit', e => { e.preventDefault(); chart($('seed').value, true); });
addEventListener('hashchange', () => { const h = slug(location.hash.slice(1)); if (h && (!S || h !== S.seed)) chart(h, false); });
chart(slug(location.hash.slice(1)) || 'saint-elsewhere', false);

/* ---------- save as a file (only where the viewer offers it) ---------- */
function exportSvg(){
  const cs = getComputedStyle(document.documentElement); let css = '';
  for (const sheet of document.styleSheets){ let rules; try { rules = sheet.cssRules; } catch (e){ continue; }
    for (const rule of rules) if (rule.selectorText && rule.selectorText.startsWith('#map')) css += rule.cssText.replace(/#map /g, '').replace(/var\((--[\w-]+)\)/g, (m, n) => cs.getPropertyValue(n).trim()) + '\n'; }
  const inner = map.innerHTML.replace('<g id="sel">', '<g id="sel" display="none">');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${HT}" width="${W}" height="${HT}"><style>${css.replace(/</g, '')}</style>${inner}</svg>`;
}
const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
use('downloads').then(dl => {
  if (!dl) return; const b = $('save'); b.hidden = false;
  b.onclick = async () => { b.disabled = true;
    try { await dl.save({ filename: 'chart-of-' + S.seed + '.svg', data: exportSvg() }); b.textContent = 'Saved. Save again?'; }
    catch (e){ b.textContent = e && e.code === 'declined' ? 'Save this chart as SVG' : 'Could not save here. Try again?'; }
    b.disabled = false; };
});
window.__exportSvg = exportSvg;
})();
</script>
